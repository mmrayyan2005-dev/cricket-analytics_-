name: 🏏 Update Cricket Data (Hourly)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CRICKET_GH_TOKEN: ${{ secrets.CRICKET_GH_TOKEN }}
      CRICKET_GH_USER:  ${{ secrets.CRICKET_GH_USER }}
      CRICKET_GH_REPO:  ${{ secrets.CRICKET_GH_REPO }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas scikit-learn requests

      - name: Run cricket data pipeline
        run: python pipeline.py

      - name: Commit & push last_updated.txt
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_updated.txt
          git diff --staged --quiet || git commit -m "data updated $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: echo "::error::Cricket data pipeline failed — check logs above."
