name: Update Cricket Data (Daily)

on:
  schedule:
    - cron: '0 2 * * *'   # runs every day at 2:00 AM UTC (7 AM Pakistan time)
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn requests

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.CRICKET_TOKEN }}
          GITHUB_USER:  ${{ secrets.CRICKET_USER }}
          GITHUB_REPO:  ${{ secrets.CRICKET_REPO }}
        run: python update_data.py

      - name: Done
        run: echo "✅ Cricket data updated successfully"
